      - name: 馃敡 Set Kernel name (璁剧疆鍐呮牳鍚嶇О)
        run: |
          cd kernel_workspace
          echo "鍐呮牳鍚庣紑锛?DEFAULT_SUFFIX"
          ESCAPED_SUFFIX=$(printf '%s\n' "$DEFAULT_SUFFIX" | sed 's:[\/&]:\\&:g')
          sudo sed -i "s/-4k/$ESCAPED_SUFFIX/g" ./common/arch/arm64/configs/gki_defconfig
          sed -i 's/${scm_version}//' ./common/scripts/setlocalversion

      - name: 馃摜 Start build timer (鏋勫缓璁℃椂寮€濮?
        run: 
          echo "BUILD_START=$(date +%s)" >> $GITHUB_ENV

      # 鏂扮増 clang 瀵规棫 libbpf 鐨?const 闄愬畾绗﹀憡璀︿細鍥?-Werror 鍙樻垚纭敊璇?      # 锛坱ools/bpf/resolve_btfids 鐨?libbpf.c 鍙敤浜庣敓鎴?BTF锛屾斁瀹?-Werror 涓嶅奖鍝嶅唴鏍镐唬鐮侊級
      - name: 馃┕ Relax libbpf -Werror (鍏煎鏂扮増 clang)
        run: |
          F="kernel_workspace/common/tools/lib/bpf/Makefile"
          if [ -f "$F" ]; then
            sed -i 's/^override CFLAGS += -Werror -Wall$/override CFLAGS += -Wall/' "$F"
            echo "==> 宸插鐞?$F"
            grep -n 'override CFLAGS += ' "$F" || true
          else
            echo "::warning::鏈壘鍒?$F"
          fi


      - name: 馃敤 Build Kernel (鏋勫缓鍐呮牳)
        run: |
          WORKDIR="$(pwd)"
          export PATH="/usr/lib/ccache:$PATH"
          export PATH="$WORKDIR/kernel_workspace/clang18/bin:$PATH"
          export PATH="$WORKDIR/kernel_workspace/build-tools/bin:$PATH"
          CLANG_DIR="$WORKDIR/kernel_workspace/clang18/bin"
          CLANG_VERSION="$($CLANG_DIR/clang --version | head -n 1)"
          LLD_VERSION="$($CLANG_DIR/ld.lld --version | head -n 1)"
          pahole_version=$(pahole --version 2>/dev/null | head -n1); [ -z "$pahole_version" ] && echo "pahole 鐗堟湰锛氭湭瀹夎" || echo "pahole 鐗堟湰锛?pahole_version"
          export CCACHE_LOGFILE="${{ github.workspace }}/kernel_workspace/ccache.log"
          export CCACHE_COMPILERCHECK="none"
          export CCACHE_BASEDIR="${{ github.workspace }}"
          export CCACHE_NOHASHDIR="true"
          export CCACHE_NOHARDLINK="true"
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export CCACHE_MAXSIZE="${{ env.CCACHE_MAXSIZE }}"
          export CCACHE_IS_KERNEL_COMPILING="true"
          echo "sloppiness = file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,file_macro,time_macros" >> "$CCACHE_DIR/ccache.conf"
          cd kernel_workspace/common
          wget https://github.com/cctv18/oppo_oplus_realme_sm8750/raw/refs/heads/main/lib/libfakestat.so
          wget https://github.com/cctv18/oppo_oplus_realme_sm8750/raw/refs/heads/main/lib/libfaketimeMT.so
          chmod 777 ./*.so
          export FAKESTAT="2025-05-25 12:00:00"
          export FAKETIME="@2025-05-25 13:00:00"
          echo "FAKESTAT=$FAKESTAT" >> $GITHUB_ENV
          echo "FAKETIME=$FAKETIME" >> $GITHUB_ENV
          SO_DIR=$(pwd)
          export PRELOAD_LIBS="$SO_DIR/libfakestat.so $SO_DIR/libfaketimeMT.so"
          echo '#!/bin/bash' > cc-wrapper
          echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> cc-wrapper
          echo 'export FAKESTAT="'$FAKESTAT'"' >> cc-wrapper
          echo 'export FAKETIME="'$FAKETIME'"' >> cc-wrapper
          echo 'ccache clang "$@"' >> cc-wrapper
          echo '#!/bin/bash' > ld-wrapper
          echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> ld-wrapper
          echo 'export FAKESTAT="'$FAKESTAT'"' >> ld-wrapper
          echo 'export FAKETIME="'$FAKETIME'"' >> ld-wrapper
          echo 'ld.lld "$@"' >> ld-wrapper
          echo '#!/bin/bash' > test-wrapper.sh
          echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> test-wrapper.sh
          echo 'export FAKESTAT="'$FAKESTAT'"' >> test-wrapper.sh
          echo 'export FAKETIME="'$FAKETIME'"' >> test-wrapper.sh
          echo 'echo ">>> Wrapper 鍐呴儴鐜妫€鏌ュ畬姣?"' >> test-wrapper.sh
          echo 'exec "$@"' >> test-wrapper.sh
          chmod +x test-wrapper.sh
          ./test-wrapper.sh date
          ./test-wrapper.sh stat ./Makefile
          chmod +x cc-wrapper ld-wrapper
          LD_PRELOAD=$PRELOAD_LIBS stat ./Makefile
          export KBUILD_BUILD_TIMESTAMP="${KERNEL_TIME}"
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /opt/ghc &
          sudo rm -rf /opt/hostedtoolcache/CodeQL &
          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" LD="ld.lld" HOSTLD=ld.lld O=out KCFLAGS+=-O2 KCFLAGS+=-Wno-error gki_defconfig &&
          if [ "${{ env.ENABLE_DROIDSPACES }}" = "true" ]; then
            bash "$GITHUB_WORKSPACE/.github/scripts/force_container_configs.sh" || exit 1
          fi &&
          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="$(pwd)/cc-wrapper" LD="$(pwd)/ld-wrapper" HOSTLD=ld.lld O=out KCFLAGS+=-O2 KCFLAGS+=-Wno-error Image
          LD_PRELOAD=$PRELOAD_LIBS stat ./Makefile
          echo "ccache 鐘舵€侊細"
          ccache -s
      
      - name: 馃晵 Calculate build time (璁＄畻鏋勫缓鏃堕棿)
        run: |
          END=$(date +%s)
          TIME=$((END - BUILD_START))
          echo "BUILD_TIME=$TIME" >> $GITHUB_ENV
          echo "Build time: $TIME seconds"

      - name: 馃搵 Dump key configs (杈撳嚭鍏抽敭閰嶇疆椤?
        if: always()
        run: |
          O="kernel_workspace/common/out"
          if [ -f "$O/.config" ]; then
            echo "===== 鍏抽敭閰嶇疆(宸茶缃? ====="
            grep -E '^CONFIG_(PID_NS|IPC_NS|SYSVIPC|SYSVIPC_SYSCTL|DEVTMPFS|NTSYNC|USER_NS|TMPFS_XATTR|TMPFS_POSIX_ACL|GKI_DYNAMIC_TASK_STRUCT_SIZE|ARCH_WANTS_DYNAMIC_TASK_STRUCT|MODULE_SCMVERSION|TRIM_UNUSED_KSYMS|MODVERSIONS|ARM64_4K_PAGES)=' "$O/.config" || true
            echo "===== 鍏抽敭閰嶇疆(鏈缃? ====="
            grep -E '^# CONFIG_(PID_NS|IPC_NS|SYSVIPC|DEVTMPFS|NTSYNC) is not set' "$O/.config" || echo "(鏃?"
          else
            echo "::warning::鏈壘鍒?$O/.config"
          fi
          echo "===== 闀滃儚 ====="
          ls -l "$O/arch/arm64/boot/Image" 2>/dev/null || echo "(鏃?Image)"
          sha256sum "$O/arch/arm64/boot/Image" 2>/dev/null || true
          echo "===== KMI 绗﹀彿鏄惁瀛樺湪浜庢簮鐮?Kconfig ====="
          grep -rln "GKI_DYNAMIC_TASK_STRUCT_SIZE" --include="Kconfig*" kernel_workspace/common 2>/dev/null | head -3 || echo "(婧愮爜涓湭瀹氫箟)"
          grep -rln "ARCH_WANTS_DYNAMIC_TASK_STRUCT" --include="Kconfig*" kernel_workspace/common 2>/dev/null | head -3 || echo "(婧愮爜涓湭瀹氫箟)"

      - name: 馃摛 Upload raw Image (涓婁紶鍘熷闀滃儚渚涙湰鍦颁綋妫€)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw_image_${{ env.DEVICES_NAME }}
          path: |
            kernel_workspace/common/out/arch/arm64/boot/Image
            kernel_workspace/common/out/.config
          if-no-files-found: warn
          retention-days: 3

      - name: 馃摜 Save ccache if needed (鏋勫缓鏃堕棿杈冮暱鎴栭娆¤惤鍦版湰鍦扮紦瀛樻椂淇濆瓨)
        if: ${{ env.BUILD_TIME > 480 || steps.ccache-restore.outputs.cache-matched-key == '' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.DEVICES_NAME }}${{ env.CACHE_VARIANT }}-${{ github.run_id }}

      - name: 馃Ч Clean old ccache (娓呯悊鏃х紦瀛?
        if: env.BUILD_TIME > 480
        uses: actions/github-script@v8
        env:
          PREFIX: ccache-${{ env.DEVICES_NAME }}${{ env.CACHE_VARIANT }}-
          CURRENT_KEY: ccache-${{ env.DEVICES_NAME }}${{ env.CACHE_VARIANT }}-${{ github.run_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const prefix = process.env.PREFIX;
            const currentKey = process.env.CURRENT_KEY;
            let page = 1;
            let deleted = 0;

            core.info('鏋勫缓鏃堕棿瓒呰繃 8 鍒嗛挓锛屽凡淇濆瓨 ccache 缂撳瓨');
            core.info(`姝ｅ湪娓呯悊鏃х紦瀛橈紝鍖归厤鍓嶇紑锛?{prefix}`);

            while (true) {
              const response = await github.rest.actions.getActionsCacheList({
                owner,
                repo,
                per_page: 100,
                page,
              });

              const caches = response.data.actions_caches || [];
              if (caches.length === 0) {
                break;
              }

              for (const cache of caches) {
                if (cache.key.startsWith(prefix) && cache.key !== currentKey) {
                  core.info(`Deleting cache: ${cache.key} (ID: ${cache.id})`);
                  await github.rest.actions.deleteActionsCacheById({
                    owner,
                    repo,
                    cache_id: cache.id,
                  });
                  deleted++;
                }
              }
              if (caches.length < 100) {
                break;
              }
              page++;
            }

            core.info(`鏃х紦瀛樻竻鐞嗗畬鎴愶紝鍏卞垹闄?${deleted} 涓紦瀛榒);

      - name: 馃摝 Make AnyKernel3 (鍒涘缓Anykernel3)
        run: |
          cp "${GITHUB_WORKSPACE}/.github/workflows/tools/main.bin" ./
          chmod +x main.bin
          ./main.bin "make_anykernel3"
          rm -rf ./main.bin
          
      - name: 馃摛 Upload AnyKernel3 (涓婁紶 Anykernel3)
        uses: actions/upload-artifact@v6
        with:
         name: AK3_${{ env.KSUVER }}_${{ env.DEVICES_NAME }}_ReSukiSU
         path: ./AnyKernel3/*

  upload_rekernel:
    name: Upload Re-Kernel Module
    if: ${{ github.event.inputs.enable_ReKernel == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 馃攷 Find Re-Kernel module zip (鏌ユ壘Re-Kernel鏈€鏂版ā鍧楀苟涓嬭浇)
        id: download-rekernel
        uses: actions/github-script@v8
        env:
          KERNEL_MAJOR: "6.6"
        with:
          script: |
            const owner = 'Sakion-Team';
            const repo = 'Re-Kernel';
            const kernelMajor = process.env.KERNEL_MAJOR;

            core.info(`姝ｅ湪鑾峰彇 ${owner}/${repo} 鐨勬渶鏂?release...`);

            const release = await github.rest.repos.getLatestRelease({
              owner,
              repo,
            });
            core.info(`鏈€鏂扮増鏈? ${release.data.tag_name}`);
            const escapedKernel = kernelMajor.replace(/\./g, '\\.');
            const pattern66 = new RegExp(`^Re-Kernel-v([\\d.]+)-${escapedKernel}\\.zip$`);
            const patternAny = new RegExp(`^Re-Kernel.*\\.zip$`, 'i');

            let targetAsset = null;
            let versionNumber = '';
            let isExactMatch = false;

            for (const asset of release.data.assets || []) {
              const match = asset.name.match(pattern66);
              if (match) {
                targetAsset = asset;
                versionNumber = match[1];
                isExactMatch = true;
                core.info(`鎵惧埌绮剧‘鍖归厤 6.6: ${asset.name}`);
                break;
              }
            }

            if (!targetAsset) {
              core.info('鏈壘鍒?.6鐗堟湰锛屾煡鎵句换鎰廟e-Kernel妯″潡...');
              for (const asset of release.data.assets || []) {
                const match = asset.name.match(patternAny);
                if (match) {
                  targetAsset = asset;
                  versionNumber = asset.name.replace(/Re-Kernel-v|.zip/gi, '').replace(/^-/, '').replace(/-$/, '') || 'latest';
                  isExactMatch = false;
                  core.info(`鎵惧埌Re-Kernel妯″潡: ${asset.name}`);
                  break;
                }
              }
            }

            if (!targetAsset) {
              core.setFailed('鏈壘鍒颁换浣?Re-Kernel 妯″潡璧勪骇');
              return;
            }

            core.info(`鎵惧埌鐩爣璧勪骇: ${targetAsset.name} (鐗堟湰: ${versionNumber}, ${(targetAsset.size / 1024).toFixed(1)} KB)`);
            core.setOutput('asset-name', targetAsset.name);
            core.setOutput('download-url', targetAsset.browser_download_url);
            core.setOutput('version-number', versionNumber);

      - name: 馃摜 Download Re-Kernel module (涓嬭浇 Re-Kernel 妯″潡)
        env:
          ASSET_NAME: ${{ steps.download-rekernel.outputs.asset-name }}
          DOWNLOAD_URL: ${{ steps.download-rekernel.outputs.download-url }}
          VERSION_NUMBER: ${{ steps.download-rekernel.outputs.version-number }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME="Re-Kernel-v${VERSION_NUMBER}"
          echo "姝ｅ湪涓嬭浇 Re-Kernel 妯″潡: $ASSET_NAME"
          echo "涓嬭浇鍦板潃: $DOWNLOAD_URL"
          echo "Artifact 鍚嶇О: $ARTIFACT_NAME"
          aria2c -s16 -x16 -k1M "$DOWNLOAD_URL" -o "$ASSET_NAME"
          echo "鉁?Re-Kernel 妯″潡涓嬭浇瀹屾垚"
          ls -lh "$ASSET_NAME"
          echo "姝ｅ湪鍒涘缓鐩綍 $ARTIFACT_NAME 骞惰В鍘嬫ā鍧?.."
          mkdir -p "$ARTIFACT_NAME"
          unzip -q "$ASSET_NAME" -d "$ARTIFACT_NAME"
          echo "鉁?鐩綍缁撴瀯:"
          ls -lR "$ARTIFACT_NAME"

      - name: 馃摛 Upload Re-Kernel module (涓婁紶 Re-Kernel 妯″潡)
        uses: actions/upload-artifact@v6
        with:
          name: Re-Kernel-v${{ steps.download-rekernel.outputs.version-number }}
          path: Re-Kernel-v${{ steps.download-rekernel.outputs.version-number }}

  release:
    name: 馃摛 Create Release (鍒涘缓鍙戝竷)
    needs: [build, upload_rekernel]
    if: ${{ github.event.inputs.enable_release == 'true' && always() && needs.build.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: 馃摜 Download all artifacts (涓嬭浇鎵€鏈夋瀯寤轰骇鐗?
        uses: actions/download-artifact@v5
        with:
          pattern: "*"
          path: ./release_assets

      - name: 馃摝 Prepare release files (鍑嗗鍙戝竷鏂囦欢)
        run: |
          echo "=== 涓嬭浇鐨勪骇鐗╁垪琛?==="
          ls -la ./release_assets/
          echo ""

          # 涓烘瘡涓?AK3 鐩綍鍒涘缓 zip 鍖?          for ak3_dir in ./release_assets/AK3_*/; do
            if [ -d "$ak3_dir" ]; then
              name=$(basename "$ak3_dir")
              echo "鎵撳寘 AK3: $name"
              (cd "$ak3_dir" && zip -qr "../${name}.zip" .)
            fi
          done

          # 濡傛灉 Re-Kernel 妯″潡瀛樺湪锛屾墦鍖呬负 zip
          for rk_dir in ./release_assets/Re-Kernel-v*/; do
            if [ -d "$rk_dir" ]; then
              name=$(basename "$rk_dir")
              echo "鎵撳寘 Re-Kernel: $name"
              (cd "$rk_dir" && zip -qr "../${name}.zip" .)
            fi
          done

          # 鍒楀嚭鎵€鏈夊緟涓婁紶鐨勬枃浠?          echo ""
          echo "=== 寰呬笂浼犲埌 Release 鐨勬枃浠?==="
          find ./release_assets -maxdepth 1 -type f | sort

      - name: 馃彿锔?Create Release and Upload Assets (鍒涘缓鍙戝竷骞朵笂浼?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # 鏃堕棿鎴?          TIME="$(TZ='Asia/Shanghai' date +'%y%m%d%H%M%S')"
          TIME_FORM="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"

          # 缂栬瘧鏈哄瀷
          DEVICE_NAME="${{ github.event.inputs.device_name }}"

          # KSU 鐗堟湰鍙凤紙鏉ヨ嚜 build job 杈撳嚭鐨?ksuver锛?          KSU_VER="${{ needs.build.outputs.ksuver }}"

          # 鍔熻兘閰嶇疆鎻忚堪
          FEATURES=""
          if [ "${{ github.event.inputs.enable_ReKernel }}" = "true" ]; then
            FEATURES="${FEATURES}- 鉁?Re-Kernel 鏀寔"$'\n'
          fi
          if [ "${{ github.event.inputs.enable_Adios }}" = "true" ]; then
            FEATURES="${FEATURES}- 鉁?ADIOS IO璋冨害鍣?$'\n'
          fi
          if [ "${{ github.event.inputs.enable_scx }}" = "true" ] || [ "${{ github.event.inputs.enable_droidspaces }}" = "true" ]; then
            FEATURES="${FEATURES}- 鉁?瀹岀編椋庨┌ (SCX)"$'\n'
          fi
          if [ "${{ github.event.inputs.enable_bbg }}" = "true" ]; then
            FEATURES="${FEATURES}- 鉁?BBG 鍩哄甫瀹堟姢"$'\n'
          fi
          if [ "${{ github.event.inputs.enable_droidspaces }}" = "true" ]; then
            FEATURES="${FEATURES}- 鉁?Droidspaces 瀹瑰櫒鏀寔"$'\n'
          fi
          FEATURES="${FEATURES}- 鉁?ReSukiSU (KernelSU)"$'\n'
          if [ "${{ github.event.inputs.enable_susfs }}" = "true" ]; then
            FEATURES="${FEATURES}- 鉁?SUSFS 鎸傝浇鏀寔"$'\n'
          fi

          # 鑷畾涔夊唴鏍稿悗缂€
          KERNEL_SUFFIX="${{ github.event.inputs.custom_kernel_suffix }}"
          if [ -z "$KERNEL_SUFFIX" ]; then
            KERNEL_SUFFIX="榛樿瀹樻柟"
          fi

          # 鑷畾涔夋瀯寤烘椂闂?          KERNEL_TIME="${{ github.event.inputs.custom_kernel_time }}"
          if [ -z "$KERNEL_TIME" ]; then
            KERNEL_TIME="榛樿瀹樻柟"
          fi

          # 鐢熸垚 Release 璇存槑
          cat << ENDOFF > release_notes.md
          ### 馃摫 SM8750 娆у姞鐪熼€氱敤鍐呮牳 | 鏋勫缓淇℃伅

          - **鍐呮牳鐗堟湰**: SM8750 (Android 15 / 6.6)
          - **ReSukiSU 鐗堟湰**: ${KSU_VER}
          - **缂栬瘧鏃堕棿**: ${TIME_FORM}
          - **缂栬瘧鏈哄瀷**: ${DEVICE_NAME}
          - **鍐呮牳鍚庣紑**: ${KERNEL_SUFFIX}
          - **鏋勫缓鏃堕棿**: ${KERNEL_TIME}
          - **浠撳簱**: ${{ github.repository }}
          - **杩愯 ID**: ${{ github.run_id }}
          - **鎻愪氦**: ${{ github.sha }}

          ### 鈿欙笍 鍔熻兘閰嶇疆

          ${FEATURES}
          ### 鈴笍 鏇存柊鍐呭

          - 鏇存柊 ReSukiSU 鑷虫渶鏂扮増鏈?(${KSU_VER})
          - 鍚屾涓婃父鍐呮牳婧愮爜

          ### 馃搵 瀹夎鏂规硶 | Installation Guide

          1. 鑻ヤ綘宸插埛鍏?ReSukiSU 鍐呮牳锛屼笖 ReSukiSU 绠＄悊鍣ㄥ凡鏇存柊鑷虫渶鏂扮増鏈紝鍙湪绠＄悊鍣ㄤ腑鐩存帴鍒峰叆 AnyKernel 鍒锋満鍖呭苟閲嶅惎锛?          2. 鐢变簬 KernelSU 涓婃父鏇存柊浜嗗厓妯″潡鍔熻兘锛屾渶鏂扮増 KSU 绠＄悊鍣ㄩ渶瑕侀厤鍚堝厓妯″潡 (metamodule) 鎵嶈兘姝ｅ父鎸傝浇妯″潡銆傜洰鍓嶇殑鍏冩ā鍧楀寘鎷?[meta overlayfs](https://github.com/KernelSU-Modules-Repo/meta-overlayfs), [mountify](https://github.com/backslashxx/mountify), [meta magicmount](https://github.com/7a72/meta-magic_mount/) 绛夈€傝嫢浣犳槸绗竴娆′娇鐢?KSU 鎴栧垰浠庢棫鐗?KSU 绠＄悊鍣ㄥ崌绾ц嚦鏂扮増锛岃鍏堝畨瑁呬竴涓厓妯″潡锛?          3. 鑻ュ惎鐢?Re-Kernel锛岄渶鍒峰叆閰嶅Re-Kernel妯″潡骞堕厤鍚?NoActive 杞欢浣跨敤锛屼互鎻愬崌鍚庡彴鍐荤粨鑳藉姏銆?
          #### 馃敆 鐩稿叧閾炬帴

          - ReSukiSU 绠＄悊鍣? [ReSukiSU_CI](https://github.com/cctv18/ReSukiSU_CI/releases)
          - SukiSU Ultra 绠＄悊鍣? [SukiSU-Ultra](https://github.com/SukiSU-Ultra/SukiSU-Ultra/releases)
          - KernelSU Next 绠＄悊鍣? [KernelSU-Next](https://github.com/KernelSU-Next/KernelSU-Next/releases)
          - KernelSU 鍘熺増绠＄悊鍣? [KernelSU](https://github.com/tiann/KernelSU/releases)
          - TG棰戦亾@qdykernel: [TG棰戦亾@qdykernel](https://t.me/qdykernel)

          #### 鈥烩€烩€?鍒峰啓鍐呮牳鏈夐闄╋紝涓洪槻姝㈠嚭鐜版剰澶栧鑷存墜鏈哄彉鐮栵紝鍦ㄥ埛鍏ュ唴鏍稿墠璇峰姟蹇呯敤 [KernelFlasher](https://github.com/capntrips/KernelFlasher) 绛夎蒋浠跺浠?boot 绛夊叧閿惎鍔ㄥ垎鍖? 鈥烩€烩€?          ENDOFF

          echo "=== Release 璇存槑 ==="
          cat release_notes.md
          echo ""

          # 鏀堕泦鎵€鏈夊緟涓婁紶鐨勬枃浠讹紙浠?AK3 zip 鍜?Re-Kernel zip锛?          RELEASE_FILES=$(find ./release_assets -maxdepth 1 -type f \( -name 'AK3_*.zip' -o -name 'Re-Kernel-v*.zip' \) 2>/dev/null || true)

          if [ -z "$RELEASE_FILES" ]; then
