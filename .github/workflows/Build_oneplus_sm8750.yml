            RELEASE_FILES=""
          fi

          echo "=== 鍒涘缓 Release ==="
          TAG_NAME="SM8750-${DEVICE_NAME}-build-${TIME}"

          gh release create "${TAG_NAME}" \
            --repo "${{ github.repository }}" \
            --title "SM8750 ${DEVICE_NAME} Kernel Build - ${TIME_FORM}" \
            --notes-file release_notes.md \
            ${RELEASE_FILES}

          echo ""
          echo "鉁?Release 鍒涘缓瀹屾垚: ${TAG_NAME}"